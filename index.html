<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shamim AI Cinematic - Social Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #f4f7fb; --card: #fff; --text: #162033; --muted: #6b7280; --primary: #4c6fff; --border: #e7e8ff; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
    .app { max-width: 480px; margin: 0 auto; background: var(--card); min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
    .header { padding: 16px; font-size: 20px; font-weight: bold; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; }
    .content { padding: 16px; flex: 1; overflow-y: auto; padding-bottom: 80px; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: white; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0; }
    .nav button { background: none; border: none; font-size: 14px; color: var(--muted); cursor: pointer; }
    .nav button.active { color: var(--primary); font-weight: bold; }
    .card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .btn { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
    input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; }
    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <span>Shamim AI Cinematic</span>
      <span id="user-status" style="font-size: 12px;">Guest</span>
    </div>

    <div class="content">
      <!-- Home Screen -->
      <div id="home" class="screen active">
        <div class="card">
          <h3>স্বাগতম, শামীম ভাই!</h3>
          <p class="muted">আপনার সিনেমাটিক সোশ্যাল প্ল্যাটফর্মের ড্যাশবোর্ড।</p>
        </div>
        <div id="posts-container"></div>
      </div>

      <!-- Auth Screen (Signup/Login) -->
      <div id="auth" class="screen">
        <div class="card">
          <h3 id="auth-title">লগইন করুন</h3>
          <input type="email" id="auth-email" placeholder="আপনার ইমেইল দিন">
          <input type="password" id="auth-password" placeholder="পাসওয়ার্ড দিন">
          <button class="btn" onclick="handleAuth()" id="auth-btn">লগইন</button>
          <p style="text-align: center; margin-top: 12px; cursor: pointer; color: var(--primary);" onclick="toggleAuthMode()">অ্যাকাউন্ট নেই? সাইন আপ করুন</p>
        </div>
      </div>

      <!-- Profile Screen -->
      <div id="profile" class="screen">
        <div class="card" style="text-align: center;">
          <h3 id="profile-name">শামীম ওসমানে শেখ</h3>
          <p id="profile-email" class="muted"></p>
          <button class="btn" style="background: #ef4444; margin-top: 16px;" onclick="handleLogout()">লগআউট</button>
        </div>
      </div>
    </div>

    <div class="nav">
      <button class="active" onclick="switchScreen('home', this)">হোম</button>
      <button onclick="switchScreen('auth', this)" id="nav-auth-btn">অ্যাকাউন্ট</button>
      <button onclick="switchScreen('profile', this)">প্রোফাইল</button>
    </div>
  </div>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'আপনার_প্রজেক্ট_ইউআরএল_এখানে_দিন';
    const SUPABASE_ANON_KEY = 'আপনার_পাবলিশেবল_কি_এখানে_দিন';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isSignup = false;

    function switchScreen(screenId, btn) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      btn.classList.add('active');
      checkUser();
    }

    function toggleAuthMode() {
      isSignup = !isSignup;
      document.getElementById('auth-title').innerText = isSignup ? 'নতুন অ্যাকাউন্ট তৈরি করুন' : 'লগইন করুন';
      document.getElementById('auth-btn').innerText = isSignup ? 'সাইন আপ' : 'লগইন';
    }

    async function handleAuth() {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      if (!email || !password) {
        alert('দয়া করে ইমেইল এবং পাসওয়ার্ড দিন!');
        return;
      }

      if (isSignup) {
        const { data, error } = await _supabase.auth.signUp({ email, password });
        if (error) alert(error.message);
        else {
          alert('সফলভাবে সাইন আপ হয়েছে! আপনার ইমেইল চেক করুন অথবা সরাসরি লগইন করুন।');
          isSignup = false;
          toggleAuthMode();
        }
      } else {
        const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
        if (error) alert(error.message);
        else {
          alert('সফলভাবে লগইন হয়েছে!');
          checkUser();
          switchScreen('home', document.querySelector('.nav button'));
        }
      }
    }

    async function handleLogout() {
      await _supabase.auth.signOut();
      checkUser();
      alert('লগআউট সফল হয়েছে!');
      switchScreen('home', document.querySelector('.nav button'));
    }

    async function checkUser() {
      const { data: { user } } = await _supabase.auth.getUser();
      const statusEl = document.getElementById('user-status');
      const profileName = document.getElementById('profile-name');
      const profileEmail = document.getElementById('profile-email');
      const navAuthBtn = document.getElementById('nav-auth-btn');

      if (user) {
        statusEl.innerText = user.email;
        profileEmail.innerText = user.email;
        navAuthBtn.innerText = 'প্রোফাইল';
      } else {
        statusEl.innerText = 'Guest';
        profileEmail.innerText = '';
        navAuthBtn.innerText = 'অ্যাকাউন্ট';
      }
    }

    checkUser();
  </script>
</body>
</html>
